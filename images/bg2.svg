<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">Quadratic and linear function graph</title>
  <desc id="description">A dark coordinate grid with a warm quadratic curve, a blue line, and marked intersections.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#263747"/>
    </linearGradient>
    <pattern id="minorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#minorGrid)"/>
      <path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="800" fill="url(#background)"/>
  <rect width="1600" height="800" fill="url(#majorGrid)"/>
  <path d="M0 510H1600M690 0V800" fill="none" stroke="#f4f0e8" stroke-opacity=".55" stroke-width="2"/>
  <path d="M80 730C300 720 445 610 565 430C645 310 730 235 835 235C970 235 1080 360 1180 520C1280 675 1400 730 1540 735" fill="none" stroke="#e88355" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M70 655L1530 145" fill="none" stroke="#6fc5e8" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#f9f3e8" stroke="#172431" stroke-width="5">
    <circle cx="526" cy="496" r="10"/>
    <circle cx="1003" cy="329" r="10"/>
  </g>
  <g fill="#ffffff" fill-opacity=".75" font-family="Space Grotesk, Arial, sans-serif" font-size="28">
    <text x="1490" y="490">x</text>
    <text x="710" y="45">y</text>
  </g>
</svg>
